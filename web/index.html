<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Todo & Timeline</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="brand-mark">⏱</span><span class="brand-text">时间管理</span></div>
      <nav class="tabs">
        <button class="tab active" data-view="today">今日</button>
        <button class="tab" data-view="todos">任务</button>
        <button class="tab" data-view="analysis">分析</button>
        <button class="tab" data-view="summary">总结</button>
        <button class="tab" data-view="settings">设置</button>
      </nav>
      <div class="topbar-spacer"></div>
      <div class="kpis" aria-label="今日核心指标">
        <span class="kpi"><span class="kpi-label">日期</span><b class="kpi-value" id="kpi-date">--</b></span>
        <span class="kpi"><span class="kpi-label">工作时长</span><b class="kpi-value" id="kpi-hours">--</b></span>
      </div>
      <div id="nav-active-timer" class="nav-timer hidden" aria-live="polite">
        <span class="nav-timer-title" id="nav-active-timer-title"></span>
        <b class="nav-timer-elapsed" id="nav-active-timer-elapsed">00:00:00</b>
        <button id="nav-active-timer-stop" class="btn btn-small btn-danger">结束</button>
      </div>
    </div>
  </header>

  <main class="page">

    <!-- ========== 今日 ========== -->
    <section class="view" id="view-today">
      <div class="grid-today">
        <aside class="col-side">
          <div class="card">
            <div class="panel-head"><h3>今日概览</h3></div>
            <div id="today-overview"></div>
          </div>
        </aside>

        <div class="col-main stack">
          <!-- 补录工时 -->
          <div class="card card-accent">
            <div class="panel-head">
              <h3>补录工时</h3>
              <span class="panel-hint">补记已完成的工作</span>
            </div>
            <div id="today-backfill-body" class="backfill-body">
              <div class="bf-row">
                <input id="bf-date" type="date" class="input" aria-label="开始日期">
                <input id="bf-start" type="time" class="input" aria-label="开始时间">
                <input id="bf-end-date" type="date" class="input" aria-label="结束日期">
                <input id="bf-end" type="time" class="input" aria-label="结束时间">
              </div>
              <div class="bf-row">
                <select id="bf-group" class="select" aria-label="按标签筛选任务"></select>
                <select id="bf-todo" class="select" aria-label="选择任务"></select>
              </div>
              <span id="bf-preview" class="bf-preview" aria-live="polite"></span>
              <div class="bf-note-row">
                <input id="bf-note" class="input" placeholder="备注（可选）">
                <button id="bf-add" class="btn btn-primary">添加记录</button>
              </div>
            </div>
          </div>

          <!-- 任务看板 -->
          <div class="card">
            <div class="panel-head">
              <h3>任务看板</h3>
              <select id="today-task-filter" class="select" aria-label="按标签筛选任务"></select>
              <button class="btn btn-small" id="today-add-group">＋ 标签</button>
              <button class="btn btn-small btn-primary" id="today-add-todo">＋ 任务</button>
            </div>
            <div id="today-tasks" class="stack-sm"></div>
          </div>
        </div>
      </div>

      <div class="grid-split">
        <div class="card">
          <div class="panel-head">
            <h3>时间轴分析</h3>
            <div class="seg" id="timeline-zoom-seg">
              <button class="seg-btn" data-zoom="24h">全天</button>
              <button class="seg-btn active" data-zoom="12h">工作时段</button>
            </div>
          </div>
          <div id="today-timeline-wrap"></div>
          <div id="today-analysis"></div>
        </div>
        <div class="card">
          <div class="panel-head"><h3>今日记录</h3></div>
          <div id="today-entries"></div>
        </div>
      </div>

      <button id="today-quick-add" class="today-quick-add" aria-label="新建任务">＋</button>
    </section>

    <!-- ========== 任务 ========== -->
    <section class="view hidden" id="view-todos">
      <div class="todos-layout">
        <aside class="groups-panel">
          <div class="panel-head">
            <h3>标签</h3>
            <button class="btn btn-small" id="add-group-btn" aria-label="新建标签">＋</button>
          </div>
          <ul id="group-list" class="group-list">
            <li class="group-item active" data-group="">全部</li>
          </ul>
        </aside>
        <div class="card">
          <div class="panel-head">
            <h3 id="todos-title">全部任务</h3>
            <button class="btn btn-small btn-primary" id="add-todo-btn">＋ 新建任务</button>
          </div>
          <div id="todo-tag-filter"></div>
          <div id="todo-list"></div>
        </div>
      </div>
    </section>

    <!-- ========== 分析 ========== -->
    <section class="view hidden" id="view-analysis">
      <div class="card">
        <div class="panel-head">
          <div class="seg">
            <button class="seg-btn active" data-scope="daily">每日</button>
            <button class="seg-btn" data-scope="weekly">每周</button>
          </div>
          <div class="topbar-spacer"></div>
          <input type="date" id="analysis-date" class="input" aria-label="选择分析日期">
          <input type="week" id="analysis-week" class="input hidden" aria-label="选择分析周">
          <button class="btn btn-small" id="analysis-prev">上一期</button>
          <button class="btn btn-small" id="analysis-next">下一期</button>
        </div>
      </div>
      <div id="analysis-content"></div>
    </section>

    <section class="view hidden" id="view-summary" aria-label="总结笔记">
      <div id="notes-content"></div>
      <div id="summary-library" class="hidden"><div id="summary-content" aria-live="polite"></div></div>
    </section>

    <!-- ========== 设置 ========== -->
    <section class="view hidden" id="view-settings">
      <div class="card settings-card" id="settings-content"></div>
    </section>

  </main>
</div>

<footer class="statusbar">
  <span>今日效率 <b id="footer-score">--</b></span>
  <span>连续专注 <b id="footer-streak">--</b> 天</span>
  <span>本周总工时 <b id="footer-week-hours">--</b></span>
</footer>

<!-- 编辑对话框 -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head"><h3 id="modal-title">编辑</h3><button id="modal-close" class="btn btn-small btn-icon" aria-label="关闭">✕</button></div>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>

<script src="/app.js"></script>
<script src="/note-core.js"></script>
<script src="/query-views.js"></script>
<script src="/notes.js"></script>
<script src="/query-blocks.js"></script>
</body>
</html>
